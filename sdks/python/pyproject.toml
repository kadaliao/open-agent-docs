[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-agent-docs"
version = "0.4.0"
description = "Python SDK for Open Agent Docs: sync and async clients, event streams, webhook verification, JWT signing, local server launcher"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "pydantic>=2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
# the in-process server (Rust, PyO3): oad.start() then needs no binary download
server = ["open-agent-docs-server==0.4.0"]

[dependency-groups]
# 跑测试和类型检查用（uv run 默认带上）
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.400"]

[project.urls]
Homepage = "https://github.com/kadaliao/open-agent-docs"
Source = "https://github.com/kadaliao/open-agent-docs/tree/main/sdks/python"
Documentation = "https://github.com/kadaliao/open-agent-docs/blob/main/sdks/python/README.md"
"简体中文 (Chinese)" = "https://github.com/kadaliao/open-agent-docs/blob/main/sdks/python/README.zh-CN.md"

[tool.hatch.build.targets.wheel]
packages = ["src/open_agent_docs"]

[tool.hatch.build.targets.sdist]
include = ["src/open_agent_docs", "README.md", "README.zh-CN.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src/open_agent_docs"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
