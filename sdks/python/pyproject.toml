[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-agent-docs"
version = "0.2.0"
description = "Open Agent Docs 的 Python SDK：同步 / 异步客户端、事件流、webhook 验签、JWT、本地起服务器"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "pydantic>=2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
# 进程内跑服务器（Rust，PyO3）：oad.start() 就不用下载二进制了
server = ["open-agent-docs-server==0.2.0"]

[dependency-groups]
# 跑测试和类型检查用（uv run 默认带上）
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.400"]

[project.urls]
Homepage = "https://github.com/kadaliao/open-agent-docs"
Source = "https://github.com/kadaliao/open-agent-docs/tree/main/sdks/python"

[tool.hatch.build.targets.wheel]
packages = ["src/open_agent_docs"]

[tool.hatch.build.targets.sdist]
include = ["src/open_agent_docs", "README.md", "README.en.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src/open_agent_docs"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
