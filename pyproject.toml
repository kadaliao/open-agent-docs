[project]
name = "open-agent-docs"
version = "0.1.0"
description = "Docs that people and AI agents write together: block-level editing with conflict checks, comments that notify agents, Notion-style databases, and an MCP endpoint."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "mcp>=2.3.0",
]

[project.scripts]
open-agent-docs = "open_agent_docs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_agent_docs"]
artifacts = ["open_agent_docs/static/**"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "data"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
