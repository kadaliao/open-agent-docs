# 不用下源码：把这个文件下载下来，改一下邮箱，然后
#   OAD_ADMIN_PASSWORD='至少 8 位' docker compose up -d
# 打开 http://127.0.0.1:8848 。对外提供服务时放在 HTTPS 反向代理后面，
# 再把下面两行 OAD_PUBLIC_URL、OAD_COOKIE_SECURE 打开（见 docs/zh/deployment.md）。
#
# No source checkout needed: download this file, change the email, then
#   OAD_ADMIN_PASSWORD='at least 8 chars' docker compose up -d
# and open http://127.0.0.1:8848. To serve it publicly, put it behind an HTTPS reverse proxy
# and uncomment OAD_PUBLIC_URL and OAD_COOKIE_SECURE (see docs/en/deployment.md).
services:
  oad:
    image: ghcr.io/kadaliao/open-agent-docs:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8848:8848"]
    volumes: ["oad-data:/data"]
    environment:
      # 只在还没有任何用户时用来建管理员 / only used to create the admin while there are no users yet
      OAD_ADMIN_EMAIL: me@example.com
      OAD_ADMIN_PASSWORD: ${OAD_ADMIN_PASSWORD:-}
      # OAD_PUBLIC_URL: https://docs.example.com
      # OAD_COOKIE_SECURE: "true"
volumes:
  oad-data:
