[package]
name = "oad-py"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
name = "open_agent_docs_server"
crate-type = ["cdylib"]
# 只在 Python 里加载，测试在 tests/（pytest）
test = false
doctest = false

[dependencies]
oad-bin = { version = "0.3.0", path = "../oad-bin" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
