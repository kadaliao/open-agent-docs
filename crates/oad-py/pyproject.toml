[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "open-agent-docs"
version = "0.2.0"
description = "在 Python 进程里起 Open Agent Docs 服务器（Rust，PyO3）"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.maturin]
module-name = "open_agent_docs"
features = []
python-source = "python"
