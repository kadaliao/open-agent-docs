[package]
name = "oad-db"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
# cdylib 给 WASM 用（packages/db-wasm），rlib 给服务器
crate-type = ["rlib", "cdylib"]

[features]
# 编成 WASM 给浏览器用：wasm-bindgen 导出 DbEngine
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
rustc-hash = "2.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = { version = "=0.2.130", optional = true }
js-sys = { version = "0.3.107", optional = true }
