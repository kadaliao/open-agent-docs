[package]
name = "oad-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
blurhash = "0.2.3"
bytes = "1.12.2"
futures-util = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
infer = "0.22.0"
oad-doc = { version = "0.1.0", path = "../oad-doc" }
oad-markdown = { version = "0.1.0", path = "../oad-markdown" }
oad-unfurl = { version = "0.1.0", path = "../oad-unfurl" }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tracing = "0.1.44"
url = "2.5.8"
webp = { version = "0.3.1", default-features = false }
yrs = { version = "0.28.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
