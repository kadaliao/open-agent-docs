[package]
name = "oad-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
argon2 = "0.6.0"
async-trait = "0.1.92"
bytes = "1.12.2"
http = "1.5.0"
oad-doc = { version = "0.1.0", path = "../oad-doc" }
oad-markdown = { version = "0.1.0", path = "../oad-markdown" }
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
yrs = { version = "0.28.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
