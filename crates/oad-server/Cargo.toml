[package]
name = "oad-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.2"
futures-util = "0.3.34"
mime_guess = "2.0.5"
oad-core = { version = "0.1.0", path = "../oad-core" }
oad-markdown = { version = "0.1.0", path = "../oad-markdown" }
oad-mcp = { version = "0.1.0", path = "../oad-mcp" }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tracing = "0.1.44"
yrs = "0.28.1"

[dev-dependencies]
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.11.0", features = ["client", "transport-streamable-http-client-reqwest"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30.0"
