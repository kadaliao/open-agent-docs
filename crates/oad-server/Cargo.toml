[package]
name = "oad-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.23.1"
brotli = "9.1.3"
bytes = "1.12.2"
flate2 = "1.1.11"
futures-util = "0.3.34"
mime_guess = "2.0.5"
oad-core = { version = "0.2.0", path = "../oad-core" }
oad-markdown = { version = "0.2.0", path = "../oad-markdown" }
oad-mcp = { version = "0.2.0", path = "../oad-mcp" }
oad-unfurl = { version = "0.2.0", path = "../oad-unfurl" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
subtle = "2.6.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["compression-br", "compression-gzip"] }
tracing = "0.1.44"
utoipa = "6.0.0"
yrs = "0.28.1"

[dev-dependencies]
ed25519-dalek = "3.0.0"
hmac = "0.13.0"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
oad-unfurl = { path = "../oad-unfurl" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "stream"] }
rmcp = { version = "3.11.0", features = ["client", "transport-streamable-http-client-reqwest"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30.0"
postgres = "0.19.14"

[build-dependencies]
brotli = "9.1.3"
mime_guess = "2.0.5"
sha2 = "0.11.1"
