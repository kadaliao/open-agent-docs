[package]
name = "oad-node"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# 只在 Node 里加载，不单独跑测试（测试在 packages/server-node/test）
test = false
doctest = false

[dependencies]
napi = { version = "3.16.2", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "3.7.1"
oad-bin = { version = "0.4.0", path = "../oad-bin" }

[build-dependencies]
napi-build = "2.6.0"
