[package]
name = "oad-mcp"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
http = "1.5.0"
oad-core = { version = "0.2.0", path = "../oad-core" }
oad-markdown = { version = "0.2.0", path = "../oad-markdown" }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
