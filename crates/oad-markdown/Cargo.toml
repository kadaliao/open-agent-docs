[package]
name = "oad-markdown"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
# cdylib 给 WASM 用（packages/markdown-wasm），rlib 给服务器
crate-type = ["rlib", "cdylib"]

[features]
# 编成 WASM 给浏览器用：wasm-bindgen 导出 parse / serialize
wasm = ["dep:wasm-bindgen"]

[dependencies]
comrak = { version = "1.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = { version = "=0.2.130", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
