<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agent Docs" />
    <title>Open Agent Docs</title>
    <script>
      // 先把主题设好，免得打开时闪一下
      try {
        var t = localStorage.getItem('oad:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        // 界面语言也先设好（标签的 lang，编辑器的数字日期格式按它）
        var l = localStorage.getItem('oad:locale') || ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en')
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
