[package]
name = "oad-example-rust-mount"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
oad-core = { path = "../../crates/oad-core" }
oad-server = { path = "../../crates/oad-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
