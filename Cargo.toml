[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# build.rs（预压缩网页）和过程宏用优化过的代码跑，不然 brotli 压 10MB 要一两分钟
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# yrs 0.28.1 加了一个小补丁：TransactionMut::set_client_id（服务器用每个写入者自己的 client id 写，不用复制整份文档）。
# 补丁只在 vendor/yrs/src/transaction.rs 里（搜 “open-agent-docs 补丁”）；升级 yrs 时把这两个方法搬过去。
[patch.crates-io]
yrs = { path = "vendor/yrs" }
